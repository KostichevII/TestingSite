{% load static %}
<html lang="ru" data-theme="{{ theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="{% static '/css/header.css' %}">
  <title>{% block title %}Test/it{% endblock %}</title>
  {% block extra_head %}{% endblock %}
</head>

<header class="site-header">
  <a href="{}" class="logo">
    Test<span class="logo-slash">/</span>it
  </a>

  <nav class="nav">
    <a href="">Главная</a>
    <a href="">Создание тестов</a>
    <a href="">Решение тестов</a>
  </nav>

  {# --- Переключатель темы --- #}
  <form method="post" action="{% url 'set_theme' %}" class="theme-form">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    {% if theme == "dark" %}
      <input type="hidden" name="theme" value="light">
      <button type="submit" class="theme-toggle" title="Светлая тема">☀️</button>
    {% else %}
      <input type="hidden" name="theme" value="dark">
      <button type="submit" class="theme-toggle" title="Тёмная тема">🌙</button>
    {% endif %}
  </form>
</header>
